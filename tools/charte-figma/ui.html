<style>
  * { box-sizing: border-box; margin: 0; font-family: "Archivo", -apple-system, "Segoe UI", sans-serif; }
  body { background: #F7F5F2; color: #141414; padding: 16px; font-size: 12px; }
  h1 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .sub { color: #6B6A66; margin-bottom: 14px; }
  h2 { font-size: 11px; font-weight: 600; margin: 16px 0 8px; color: #141414; }
  .card { background: #FCFBF9; border: 1px solid #B9B5AB; border-radius: 10px; padding: 10px 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; gap: 8px; }
  .row label { color: #3f3e3b; flex: 1; }
  input[type="color"] { width: 44px; height: 24px; border: 1px solid #B9B5AB; border-radius: 6px; padding: 0 2px; background: #fff; }
  input[type="number"] { width: 58px; border: 1px solid #B9B5AB; border-radius: 6px; padding: 4px 6px; font-size: 12px; background: #fff; }
  input[type="range"] { flex: 1; accent-color: #2B47E8; }
  .val { width: 34px; text-align: right; color: #6B6A66; font-variant-numeric: tabular-nums; }
  .presets { display: flex; gap: 6px; margin-bottom: 4px; }
  .presets button { flex: 1; border: 1px solid #B9B5AB; background: #FCFBF9; border-radius: 999px; padding: 6px 0; font-size: 11px; cursor: pointer; }
  .presets button:hover { border-color: #2B47E8; color: #2B47E8; }
  .actions { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .primary { background: #2B47E8; color: #fff; border: 0; border-radius: 999px; padding: 10px 0; font-size: 13px; font-weight: 500; cursor: pointer; width: 100%; }
  .primary:disabled { opacity: 0.5; }
  .ghost { background: transparent; border: 1px solid #B9B5AB; border-radius: 999px; padding: 8px 0; font-size: 12px; cursor: pointer; width: 100%; color: #141414; }
  .note { color: #6B6A66; margin-top: 10px; line-height: 1.5; }
  .err { color: #b02020; margin-top: 10px; }
  a.dl { display: none; }
</style>

<h1>Charte Comevaa</h1>
<div class="sub">Un geste, tout le fichier suit : variables, degrades, grains.</div>

<div class="presets">
  <button data-preset="edito">Edito</button>
  <button data-preset="maison">Maison</button>
  <button data-preset="orbit">Orbit</button>
</div>

<h2>L'accent</h2>
<div class="card" id="accent-box"></div>

<h2>Gamme claire</h2>
<div class="card" id="light-box"></div>

<h2>Gamme sombre</h2>
<div class="card" id="dark-box"></div>

<h2>Radius</h2>
<div class="card" id="radius-box"></div>

<h2>Matieres</h2>
<div class="card" id="mat-box">
  <div class="row"><label>Grain leger (papier, disques)</label><input type="range" id="g-leger" min="0" max="20" value="5"><span class="val" id="v-leger">5</span></div>
  <div class="row"><label>Grain fort (capsules, CTA)</label><input type="range" id="g-fort" min="0" max="30" value="12"><span class="val" id="v-fort">12</span></div>
  <div class="row"><label>Densite du grain</label><input type="range" id="g-dens" min="10" max="100" value="50"><span class="val" id="v-dens">50</span></div>
  <div class="row"><label>Verre depoli (blur)</label><input type="range" id="g-blur" min="0" max="80" value="34"><span class="val" id="v-blur">34</span></div>
</div>

<div class="actions">
  <button class="primary" id="apply">Appliquer a tout le fichier</button>
  <button class="ghost" id="export">Exporter tokens.json + CSS</button>
</div>
<div class="note">L'accent pale et les degrades se recalculent depuis l'accent : ils ne se reglent pas a la main. Le meme tokens.json alimente le site.</div>
<div class="err" id="err"></div>
<a class="dl" id="dl"></a>

<script>
  const COLORS = [
    ["accent", "Accent (le signal)", "accent-box"],
    ["papier", "Papier", "light-box"],
    ["papierCarte", "Papier carte", "light-box"],
    ["papierCreux", "Papier creux", "light-box"],
    ["filetFane", "Filet fane", "light-box"],
    ["encre", "Encre", "light-box"],
    ["texteSourd", "Texte sourd", "light-box"],
    ["sombreSurface", "Surface", "dark-box"],
    ["sombreSurfaceHaute", "Surface haute", "dark-box"],
    ["sombreBordure", "Bordure", "dark-box"],
    ["sombreTexte", "Texte", "dark-box"],
    ["sombreTexteSourd", "Texte sourd", "dark-box"],
    ["sombreAccentTexte", "Accent texte", "dark-box"]
  ];
  const RADII = [["pilule", "Pilule"], ["carte", "Carte"], ["feuille", "Feuille"]];

  for (const [key, label, box] of COLORS) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<label>' + label + '</label><input type="color" id="c-' + key + '">';
    document.getElementById(box).appendChild(row);
  }
  for (const [key, label] of RADII) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<label>' + label + '</label><input type="number" id="r-' + key + '" min="0" max="999">';
    document.getElementById("radius-box").appendChild(row);
  }
  for (const id of ["leger", "fort", "dens", "blur"]) {
    const inp = document.getElementById("g-" + id);
    inp.addEventListener("input", () => document.getElementById("v-" + id).textContent = inp.value);
  }

  const PRESETS = {
    edito:  { accent: "#2B47E8", radii: { pilule: 999, carte: 12, feuille: 18 } },
    maison: { accent: "#1E6B4F", radii: { pilule: 999, carte: 2,  feuille: 4  } },
    orbit:  { accent: "#7C5CFF", radii: { pilule: 999, carte: 20, feuille: 26 } }
  };
  document.querySelectorAll("[data-preset]").forEach((b) => b.addEventListener("click", () => {
    const p = PRESETS[b.dataset.preset];
    document.getElementById("c-accent").value = p.accent;
    for (const k of ["pilule", "carte", "feuille"]) document.getElementById("r-" + k).value = p.radii[k];
  }));

  const collect = () => {
    const colors = {}, radii = {};
    for (const [key] of COLORS) colors[key] = document.getElementById("c-" + key).value;
    for (const [key] of RADII) radii[key] = Number(document.getElementById("r-" + key).value);
    return {
      colors, radii,
      grain: {
        leger: Number(document.getElementById("g-leger").value),
        fort: Number(document.getElementById("g-fort").value),
        densite: Number(document.getElementById("g-dens").value) / 100
      },
      blur: Number(document.getElementById("g-blur").value)
    };
  };

  const applyBtn = document.getElementById("apply");
  applyBtn.addEventListener("click", () => {
    applyBtn.disabled = true;
    applyBtn.textContent = "Application en cours";
    parent.postMessage({ pluginMessage: { type: "apply", payload: collect() } }, "*");
  });
  document.getElementById("export").addEventListener("click", () => {
    parent.postMessage({ pluginMessage: { type: "export", payload: collect() } }, "*");
  });

  const download = (name, text) => {
    const a = document.getElementById("dl");
    a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
    a.download = name;
    a.click();
  };

  onmessage = (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;
    if (m.type === "state") {
      if (m.state.error) { document.getElementById("err").textContent = m.state.error; return; }
      for (const [key] of COLORS) if (m.state.colors[key]) document.getElementById("c-" + key).value = m.state.colors[key];
      for (const [key] of RADII) if (typeof m.state.radii[key] === "number") document.getElementById("r-" + key).value = m.state.radii[key];
    }
    if (m.type === "applied") {
      applyBtn.disabled = false;
      applyBtn.textContent = "Appliquer a tout le fichier";
      if (m.res && m.res.error) document.getElementById("err").textContent = m.res.error;
    }
    if (m.type === "files") {
      download("tokens.json", m.json);
      setTimeout(() => download("charte.css", m.css), 300);
    }
  };

  parent.postMessage({ pluginMessage: { type: "init" } }, "*");
</script>
